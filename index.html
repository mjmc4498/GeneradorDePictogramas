<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Pictogramas con Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }
        .icon-gallery {
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1rem;
            background-color: #fff;
        }
        .pictogram-wrapper {
            position: relative;
        }
        .pictogram-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            cursor: pointer;
            border: 3px solid transparent;
            border-radius: 0.5rem;
            transition: all 0.2s ease-in-out;
            background-color: #fff;
        }
        .pictogram-source {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 0.6rem;
            padding: 2px 4px;
            border-radius: 3px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
        }
        .pictogram-img:hover {
            transform: scale(1.05);
            border-color: #0d6efd;
        }
        .pictogram-img.selected {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        #pictogram-container {
            transition: all 0.3s ease-in-out;
        }
        #history-container .pictogram-wrapper {
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container my-5">
        <header class="text-center mb-5">
            <h1 class="display-4">Generador de Pictogramas</h1>
            <p class="lead">Crea pictogramas de forma sencilla y accesible.</p>
        </header>

        <main class="card p-4 p-md-5">
            <div class="row g-5">
                <!-- Columna de Selección y Creación -->
                <div class="col-lg-7">
                    <section class="mb-4">
                        <label for="icon-search" class="form-label h4">1. Busca un Pictograma</label>
                        <div class="input-group">
                            <input type="text" id="icon-search" class="form-control form-control-lg" placeholder="Ej: casa, perro, feliz...">
                            <button class="btn btn-primary" type="button" id="search-btn">Buscar</button>
                        </div>
                    </section>

                    <section class="mb-4">
                        <h4 class="h5">Resultados</h4>
                        <div id="icon-gallery-wrapper" class="position-relative" style="min-height: 150px;">
                            <div id="icon-gallery" class="icon-gallery d-flex flex-wrap gap-2">
                                <!-- Pictogramas se cargarán aquí -->
                            </div>
                            <div id="loader" class="position-absolute top-50 start-50 translate-middle d-none">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Cargando...</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section>
                        <label for="pictogram-text" class="form-label h4">2. Añade un Texto</label>
                        <input type="text" id="pictogram-text" class="form-control form-control-lg" placeholder="Frase corta...">
                    </section>
                </div>

                <!-- Columna de Previsualización y Generación -->
                <div class="col-lg-5">
                    <aside>
                        <h2 class="h4">3. Previsualización</h2>
                        <div id="pictogram-container" class="d-flex flex-column justify-content-center align-items-center text-center bg-white rounded p-3" style="border: 2px dashed #dee2e6; min-height: 250px;">
                            <p class="text-muted">Selecciona un pictograma y escribe un texto para ver el resultado.</p>
                        </div>
                        <div id="download-options" class="d-grid gap-2 d-none">
                            <button id="download-png-btn" class="btn btn-primary btn-lg">Descargar PNG</button>
                            <button id="download-pdf-btn" class="btn btn-secondary btn-lg">Descargar PDF</button>
                        </div>
                    </aside>
                </div>
            </div>
        </main>

        <footer class="mt-5">
            <section id="history-section">
                <h2 class="h4 text-center mb-3">Historial Reciente</h2>
                <div id="history-container" class="d-flex flex-wrap gap-3 justify-content-center">
                    <!-- El historial se cargará aquí -->
                </div>
            </section>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const { jsPDF } = window.jspdf;

            // --- 1. STATE MANAGEMENT ---
            const AppState = {
                state: {
                    currentSearch: '',
                    pictograms: [],
                    isLoading: false,
                    selectedIconUrl: null,
                    text: '',
                    history: JSON.parse(localStorage.getItem('pictogramHistory')) || [],
                },
                listeners: [],

                getState() {
                    return this.state;
                },

                setState(newState) {
                    this.state = { ...this.state, ...newState };
                    if (newState.history) {
                        localStorage.setItem('pictogramHistory', JSON.stringify(this.state.history));
                    }
                    this.listeners.forEach(listener => listener(this.state));
                },

                subscribe(listener) {
                    this.listeners.push(listener);
                },

                addToHistory(pictogram) {
                    const newHistory = [pictogram, ...this.state.history.filter(p => p.id !== pictogram.id)].slice(0, 10);
                    this.setState({ history: newHistory });
                }
            };

            // --- 2. API MODULE ---
            const ApiModule = {
                openMojiData: [],
                arasaacSearch: async (text) => {
                    const response = await fetch(`https://api.arasaac.org/api/pictograms/es/search/${text}`);
                    if (!response.ok) return [];
                    const data = await response.json();
                    return data.map(p => ({
                        id: p._id, url: `https://api.arasaac.org/api/pictograms/${p._id}?skin=white`,
                        tags: p.keywords.join(' '), source: 'ARASAAC'
                    }));
                },
                openMojiSearch: (text) => {
                    return ApiModule.openMojiData
                        .filter(e => e.annotation.includes(text) || e.tags.includes(text))
                        .map(e => ({
                            id: e.hexcode, url: `https://openmoji.org/data/color/svg/${e.hexcode}.svg`,
                            tags: `${e.annotation} ${e.tags}`, source: 'OpenMoji'
                        }));
                },
                loadOpenMoji: async () => {
                    if (ApiModule.openMojiData.length > 0) return;
                    const response = await fetch('https://raw.githubusercontent.com/hfg-gmuend/openmoji/master/data/openmoji.json');
                    if (!response.ok) throw new Error('Could not load OpenMoji data');
                    ApiModule.openMojiData = await response.json();
                },
                searchAll: async (text) => {
                    if (!text) return;
                    AppState.setState({ isLoading: true });
                    try {
                        const arasaac = await ApiModule.arasaacSearch(text);
                        const openmoji = ApiModule.openMojiSearch(text);
                        AppState.setState({ pictograms: [...arasaac, ...openmoji], isLoading: false });
                    } catch (e) {
                        console.error(e);
                        AppState.setState({ isLoading: false, pictograms: [] });
                    }
                }
            };

            // --- 3. UI COMPONENTS ---
            const UI = {
                elements: {
                    searchForm: document.getElementById('search-btn').parentElement,
                    searchInput: document.getElementById('icon-search'),
                    galleryWrapper: document.getElementById('icon-gallery-wrapper'),
                    gallery: document.getElementById('icon-gallery'),
                    loader: document.getElementById('loader'),
                    textInput: document.getElementById('pictogram-text'),
                    preview: document.getElementById('pictogram-container'),
                    downloadButtons: document.getElementById('download-options'),
                    historyContainer: document.getElementById('history-container'),
                },
                renderGallery: (state) => {
                    UI.elements.gallery.innerHTML = '';
                    UI.elements.loader.classList.toggle('d-none', !state.isLoading);
                    if (!state.isLoading && state.pictograms.length === 0 && state.currentSearch) {
                        UI.elements.gallery.innerHTML = '<p class="text-muted">No se encontraron resultados.</p>';
                    } else {
                        state.pictograms.forEach(p => UI.elements.gallery.appendChild(UI.createPictoElement(p)));
                    }
                },
                renderPreview: (state) => {
                    const { selectedIconUrl, text } = state;
                    if (!selectedIconUrl && !text) {
                        UI.elements.preview.innerHTML = '<p class="text-muted">Selecciona un pictograma y escribe un texto.</p>';
                    } else {
                        UI.elements.preview.innerHTML = `
                            ${selectedIconUrl ? `<img src="${selectedIconUrl}" alt="Pictograma" class="img-fluid" style="max-height: 150px;" crossorigin="anonymous">` : ''}
                            <p class="mt-2 h5">${text || ''}</p>
                        `;
                    }
                    UI.elements.downloadButtons.classList.toggle('d-none', !(selectedIconUrl && text));
                },
                createPictoElement: (pictogram) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'pictogram-wrapper';
                    wrapper.innerHTML = `
                        <img src="${pictogram.url}" alt="${pictogram.tags}" class="pictogram-img" data-tags="${pictogram.tags}">
                        <span class="pictogram-source">${pictogram.source}</span>`;
                    wrapper.addEventListener('click', () => AppState.setState({ selectedIconUrl: pictogram.url }));
                    return wrapper;
                },
                updateSelected: (state) => {
                    document.querySelectorAll('.pictogram-img').forEach(img => {
                        img.classList.toggle('selected', img.src === state.selectedIconUrl);
                    });
                },
                renderHistory: (state) => {
                    UI.elements.historyContainer.innerHTML = '';
                    state.history.forEach(p => {
                        const wrapper = document.createElement('div');
                        wrapper.className = 'pictogram-wrapper';
                        wrapper.innerHTML = `
                            <img src="${p.url}" alt="${p.text}" class="pictogram-img">
                            <p class="text-center small mt-1">${p.text}</p>
                        `;
                        wrapper.addEventListener('click', () => {
                            AppState.setState({ selectedIconUrl: p.url, text: p.text });
                        });
                        UI.elements.historyContainer.appendChild(wrapper);
                    });
                }
            };

            // --- 4. DOWNLOAD MODULE ---
            const DownloadModule = {
                init: () => {
                    document.getElementById('download-png-btn').addEventListener('click', DownloadModule.asPng);
                    document.getElementById('download-pdf-btn').addEventListener('click', DownloadModule.asPdf);
                },
                asPng: () => {
                    DownloadModule.saveToHistory();
                    html2canvas(UI.elements.preview, { useCORS: true, backgroundColor: null })
                        .then(c => {
                            const link = document.createElement('a');
                            link.download = 'pictograma.png';
                            link.href = c.toDataURL('image/png');
                            link.click();
                        });
                },
                asPdf: () => {
                    DownloadModule.saveToHistory();
                    html2canvas(UI.elements.preview, { useCORS: true, backgroundColor: null })
                        .then(c => {
                            const imgData = c.toDataURL('image/png');
                            const pdf = new jsPDF({ orientation: 'p', unit: 'px', format: [c.width, c.height] });
                            pdf.addImage(imgData, 'PNG', 0, 0, c.width, c.height);
                            pdf.save('pictograma.pdf');
                        });
                },
                saveToHistory: () => {
                    const { selectedIconUrl, text } = AppState.getState();
                    if (selectedIconUrl && text) {
                        const pictogram = {
                            id: `${selectedIconUrl}-${text}`,
                            url: selectedIconUrl,
                            text: text,
                        };
                        AppState.addToHistory(pictogram);
                    }
                }
            };

            // --- 5. APP INITIALIZATION ---
            const App = {
                init: () => {
                    // Subscribe UI components to state changes
                    AppState.subscribe(UI.renderGallery);
                    AppState.subscribe(UI.renderPreview);
                    AppState.subscribe(UI.updateSelected);
                    AppState.subscribe(UI.renderHistory);

                    // Setup event listeners
                    UI.elements.searchForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const searchTerm = UI.elements.searchInput.value;
                        AppState.setState({ currentSearch: searchTerm });
                        ApiModule.searchAll(searchTerm);
                    });
                    UI.elements.textInput.addEventListener('input', (e) => {
                        AppState.setState({ text: e.target.value });
                    });

                    DownloadModule.init();

                    // Initial Load
                    ApiModule.loadOpenMoji().catch(console.error);
                    AppState.setState({}); // Initial render
                }
            };

            App.init();
        });
    </script>
</body>
</html>
