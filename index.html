<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Pictogramas con Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .icon-gallery {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            padding: 1rem;
        }
        .pictogram-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 8px;
            transition: border-color 0.2s;
        }
        .pictogram-img.selected {
            border-color: #0d6efd;
        }
        #pictogram-container {
            border: 2px dashed #0d6efd;
            padding: 1.5rem;
            min-height: 200px;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <header class="text-center mb-4">
            <h1 class="display-4">Generador de Pictogramas</h1>
        </header>

        <main class="card p-4">
            <div class="row">
                <div class="col-md-6">
                    <section id="icon-selector">
                        <h2 class="h4">Elige un Pictograma</h2>
                        <input type="text" id="icon-search" class="form-control mb-3" placeholder="Buscar pictograma...">
                        <div id="icon-gallery" class="icon-gallery d-flex flex-wrap gap-2">
                            <!-- Las imágenes de los pictogramas se cargarán aquí -->
                        </div>
                    </section>
                </div>
                <div class="col-md-6">
                    <section id="text-input" class="mb-3">
                        <h2 class="h4">Escribe una Frase</h2>
                        <input type="text" id="pictogram-text" class="form-control" placeholder="Frase corta...">
                    </section>

                    <button id="generate-btn" class="btn btn-primary w-100 mb-3">Generar Pictograma</button>

                    <section id="pictogram-output">
                        <h2 class="h4">Pictograma Generado</h2>
                        <div id="pictogram-container" class="d-flex flex-column justify-content-center align-items-center text-center">
                            <!-- Aquí se mostrará el pictograma -->
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const iconGallery = document.getElementById('icon-gallery');
            const iconSearch = document.getElementById('icon-search');
            const textInput = document.getElementById('pictogram-text');
            const generateBtn = document.getElementById('generate-btn');
            const pictogramContainer = document.getElementById('pictogram-container');

            let selectedIconUrl = null;

            // Función para cargar pictogramas de ARASAAC
            const loadArasaacPictograms = async (searchText = 'sonrisa') => {
                try {
                    const response = await fetch(`https://api.arasaac.org/api/pictograms/es/search/${searchText}`);
                    const pictograms = await response.json();

                    iconGallery.innerHTML = '';
                    pictograms.slice(0, 50).forEach(pictogram => { // Limitar a 50 para el ejemplo
                        const img = document.createElement('img');
                        img.src = `https://api.arasaac.org/api/pictograms/${pictogram._id}`;
                        img.alt = pictogram.keywords.join(', ');
                        img.className = 'pictogram-img';
                        img.dataset.tags = pictogram.keywords.join(' ');

                        img.addEventListener('click', () => {
                            document.querySelectorAll('.pictogram-img').forEach(i => i.classList.remove('selected'));
                            img.classList.add('selected');
                            selectedIconUrl = img.src;
                        });

                        iconGallery.appendChild(img);
                    });
                } catch (error) {
                    console.error('Error al cargar los pictogramas de ARASAAC:', error);
                    iconGallery.innerHTML = '<p class="text-danger">No se pudieron cargar los pictogramas.</p>';
                }
            };

            // Cargar pictogramas iniciales
            loadArasaacPictograms();

            // Lógica de búsqueda
            iconSearch.addEventListener('input', () => {
                loadArasaacPictograms(iconSearch.value);
            });

            // Lógica de generación
            generateBtn.addEventListener('click', () => {
                const text = textInput.value.trim();

                if (!selectedIconUrl) {
                    alert('Por favor, elige un pictograma.');
                    return;
                }

                if (text === '') {
                    alert('Por favor, escribe una frase.');
                    return;
                }

                pictogramContainer.innerHTML = `
                    <img src="${selectedIconUrl}" alt="Pictograma seleccionado" style="width: 120px; height: 120px; object-fit: contain;">
                    <p class="mt-2 h5">${text}</p>
                `;
            });
        });
    </script>
</body>
</html>
