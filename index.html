<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Pictogramas con Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
        }
        .icon-gallery {
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1rem;
            background-color: #fff;
        }
        .pictogram-wrapper {
            position: relative;
        }
        .pictogram-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            cursor: pointer;
            border: 3px solid transparent;
            border-radius: 0.5rem;
            transition: all 0.2s ease-in-out;
            background-color: #fff;
        }
        .pictogram-source {
            position: absolute;
            bottom: 5px;
            right: 5px;
            font-size: 0.6rem;
            padding: 2px 4px;
            border-radius: 3px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
        }
        .pictogram-img:hover {
            transform: scale(1.05);
            border-color: #0d6efd;
        }
        .pictogram-img.selected {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        #pictogram-container {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container my-5">
        <header class="text-center mb-5">
            <h1 class="display-4">Generador de Pictogramas</h1>
            <p class="lead">Crea pictogramas de forma sencilla y accesible.</p>
        </header>

        <main class="card p-4 p-md-5">
            <div class="row g-5">
                <!-- Columna de Selección y Creación -->
                <div class="col-lg-7">
                    <section class="mb-4">
                        <label for="icon-search" class="form-label h4">1. Busca un Pictograma</label>
                        <div class="input-group">
                            <input type="text" id="icon-search" class="form-control form-control-lg" placeholder="Ej: casa, perro, feliz...">
                            <button class="btn btn-primary" type="button" id="search-btn">Buscar</button>
                        </div>
                    </section>

                    <section class="mb-4">
                        <h4 class="h5">Resultados</h4>
                        <div id="icon-gallery-wrapper" class="position-relative" style="min-height: 150px;">
                            <div id="icon-gallery" class="icon-gallery d-flex flex-wrap gap-2">
                                <!-- Pictogramas se cargarán aquí -->
                            </div>
                            <div id="loader" class="position-absolute top-50 start-50 translate-middle d-none">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Cargando...</span>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section>
                        <label for="pictogram-text" class="form-label h4">2. Añade un Texto</label>
                        <input type="text" id="pictogram-text" class="form-control form-control-lg" placeholder="Frase corta...">
                    </section>
                </div>

                <!-- Columna de Previsualización y Generación -->
                <div class="col-lg-5">
                    <aside>
                        <h2 class="h4">3. Previsualización</h2>
                        <div id="pictogram-container" class="d-flex flex-column justify-content-center align-items-center text-center bg-white rounded p-3" style="border: 2px dashed #dee2e6; min-height: 250px;">
                            <p class="text-muted">Selecciona un pictograma y escribe un texto para ver el resultado.</p>
                        </div>
                        <div id="download-options" class="d-grid gap-2 d-none">
                            <button id="download-png-btn" class="btn btn-primary btn-lg">Descargar PNG</button>
                            <button id="download-pdf-btn" class="btn btn-secondary btn-lg">Descargar PDF</button>
                        </div>
                    </aside>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const { jsPDF } = window.jspdf;

            // State
            let state = {
                selectedIconUrl: null,
                text: '',
                pictograms: [],
                isLoading: false,
            };

            // Elements
            const elements = {
                iconSearch: document.getElementById('icon-search'),
                searchBtn: document.getElementById('search-btn'),
                iconGallery: document.getElementById('icon-gallery'),
                loader: document.getElementById('loader'),
                textInput: document.getElementById('pictogram-text'),
                pictogramContainer: document.getElementById('pictogram-container'),
                downloadOptions: document.getElementById('download-options'),
                downloadPngBtn: document.getElementById('download-png-btn'),
                downloadPdfBtn: document.getElementById('download-pdf-btn'),
            };

            // API
            const Apis = {
                arasaac: {
                    search: async (searchText) => {
                        const response = await fetch(`https://api.arasaac.org/api/pictograms/es/search/${searchText}`);
                        if (!response.ok) throw new Error('Error en ARASAAC');
                        const data = await response.json();
                        return data.map(p => ({
                            id: p._id,
                            url: `https://api.arasaac.org/api/pictograms/${p._id}?skin=white`,
                            tags: p.keywords.join(' '),
                            source: 'ARASAAC'
                        }));
                    }
                },
                openmoji: {
                    data: [],
                    load: async () => {
                        if (Apis.openmoji.data.length > 0) return;
                        const response = await fetch('https://raw.githubusercontent.com/hfg-gmuend/openmoji/master/data/openmoji.json');
                        if (!response.ok) throw new Error('Error al cargar OpenMoji');
                        Apis.openmoji.data = await response.json();
                    },
                    search: (searchText) => {
                        return Apis.openmoji.data
                            .filter(emoji => emoji.annotation.includes(searchText) || emoji.tags.includes(searchText))
                            .map(emoji => ({
                                id: emoji.hexcode,
                                url: `https://openmoji.org/data/color/svg/${emoji.hexcode}.svg`,
                                tags: `${emoji.annotation} ${emoji.tags}`,
                                source: 'OpenMoji'
                            }));
                    }
                }
            };

            // Render functions
            const render = () => {
                // Render gallery
                elements.iconGallery.innerHTML = '';
                if (state.isLoading) {
                    elements.loader.classList.remove('d-none');
                } else {
                    elements.loader.classList.add('d-none');
                    if (state.pictograms.length === 0) {
                        elements.iconGallery.innerHTML = '<p class="text-muted">No se encontraron pictogramas.</p>';
                    } else {
                        state.pictograms.forEach(p => elements.iconGallery.appendChild(createPictogramElement(p)));
                    }
                }

                // Render preview
                if (state.selectedIconUrl || state.text) {
                    elements.pictogramContainer.innerHTML = `
                        ${state.selectedIconUrl ? `<img src="${state.selectedIconUrl}" alt="Pictograma" class="img-fluid" style="max-height: 150px;" crossorigin="anonymous">` : ''}
                        ${state.text ? `<p class="mt-2 h5">${state.text}</p>` : ''}
                    `;
                } else {
                    elements.pictogramContainer.innerHTML = '<p class="text-muted">Selecciona un pictograma y escribe un texto.</p>';
                }

                // Update button state
                if (state.selectedIconUrl && state.text) {
                    elements.downloadOptions.classList.remove('d-none');
                } else {
                    elements.downloadOptions.classList.add('d-none');
                }
            };

            const createPictogramElement = (pictogram) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'pictogram-wrapper';

                const img = document.createElement('img');
                img.src = pictogram.url;
                img.alt = pictogram.tags;
                img.className = 'pictogram-img';
                img.dataset.tags = pictogram.tags;

                const source = document.createElement('span');
                source.className = 'pictogram-source';
                source.textContent = pictogram.source;

                wrapper.appendChild(img);
                wrapper.appendChild(source);

                wrapper.addEventListener('click', () => {
                    state.selectedIconUrl = img.src;
                    document.querySelectorAll('.pictogram-img').forEach(i => i.classList.remove('selected'));
                    img.classList.add('selected');
                    render();
                });
                return wrapper;
            };

            // Download functions
            const downloadAsPng = () => {
                html2canvas(elements.pictogramContainer, { useCORS: true }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'pictograma.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            };

            const downloadAsPdf = () => {
                html2canvas(elements.pictogramContainer, { useCORS: true }).then(canvas => {
                    const imgData = canvas.toDataURL('image/png');
                    const pdf = new jsPDF();
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                    pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                    pdf.save('pictograma.pdf');
                });
            };

            // Event Listeners
            const setupEventListeners = () => {
                const performSearch = async () => {
                    const searchText = elements.iconSearch.value.toLowerCase().trim();
                    if (!searchText) return;

                    state.isLoading = true;
                    render();

                    try {
                        const arasaacResults = await Apis.arasaac.search(searchText);
                        const openmojiResults = Apis.openmoji.search(searchText);

                        state.pictograms = [...arasaacResults, ...openmojiResults];
                    } catch (error) {
                        console.error(error);
                        elements.iconGallery.innerHTML = `<p class="text-danger">Error al buscar pictogramas.</p>`;
                    } finally {
                        state.isLoading = false;
                        render();
                    }
                };

                elements.searchBtn.addEventListener('click', performSearch);
                elements.iconSearch.addEventListener('keypress', (e) => e.key === 'Enter' && performSearch());

                elements.textInput.addEventListener('input', (e) => {
                    state.text = e.target.value;
                    render();
                });

                elements.downloadPngBtn.addEventListener('click', downloadAsPng);
                elements.downloadPdfBtn.addEventListener('click', downloadAsPdf);
            };

            // Init
            const init = async () => {
                setupEventListeners();
                render();
                try {
                    await Apis.openmoji.load();
                } catch (error) {
                    console.error(error);
                    // Opcional: mostrar un mensaje al usuario
                }
            };

            init();
        });
    </script>
</body>
</html>
